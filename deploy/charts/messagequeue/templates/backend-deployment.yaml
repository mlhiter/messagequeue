apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messagequeue.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "messagequeue.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "messagequeue.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "messagequeue.backendServiceAccount" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "messagequeue.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: backend
          image: {{ include "messagequeue.image" (dict "root" . "image" .Values.images.backend) | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: {{ include "messagequeue.fullname" . }}-backend
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.health.readyPath }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.health.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
