apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "messagequeue.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "messagequeue.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "messagequeue.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "messagequeue.frontendServiceAccount" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- include "messagequeue.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "messagequeue.image" (dict "root" . "image" .Values.images.frontend) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "messagequeue.fullname" . }}-frontend
                  key: API_BASE_URL
            - name: BACKEND_URL
              value: {{ printf "http://%s-backend:%d" (include "messagequeue.fullname" .) (int .Values.backend.port) | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.health.path }}
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.health.path }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
