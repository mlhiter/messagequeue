{{- if and .Values.observability.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "messagequeue.fullname" . }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      messagequeue.sealos.io/metrics: control-plane
  endpoints:
    - port: metrics
      path: {{ .Values.controller.metrics.path }}
      interval: {{ .Values.observability.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.serviceMonitor.scrapeTimeout }}
{{- else if .Values.observability.serviceMonitor.enabled }}
{{- fail "observability.serviceMonitor.enabled requires monitoring.coreos.com/v1" }}
{{- end }}
{{- if and .Values.observability.vmPodScrape.enabled (.Capabilities.APIVersions.Has "operator.victoriametrics.com/v1beta1") }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ include "messagequeue.fullname" . }}-kafka
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ required "backend.workspaceNamespace is required" .Values.backend.workspaceNamespace | quote }}
  selector:
    matchExpressions:
      - key: messagequeue.sealos.io/managed
        operator: In
        values:
          - "true"
      - key: strimzi.io/component-type
        operator: In
        values:
          - kafka
          - kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: {{ .Values.observability.vmPodScrape.interval }}
      scrapeTimeout: {{ .Values.observability.vmPodScrape.scrapeTimeout }}
      relabelConfigs:
        - sourceLabels:
            - __meta_kubernetes_namespace
          targetLabel: namespace
          action: replace
        - sourceLabels:
            - __meta_kubernetes_pod_label_strimzi_io_cluster
          targetLabel: strimzi_io_cluster
          action: replace
{{- else if .Values.observability.vmPodScrape.enabled }}
{{- fail "observability.vmPodScrape.enabled requires operator.victoriametrics.com/v1beta1" }}
{{- end }}
