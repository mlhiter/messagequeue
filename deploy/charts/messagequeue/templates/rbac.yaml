apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "messagequeue.fullname" . }}-controller
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
rules:
  - apiGroups: ["messagequeue.sealos.io"]
    resources: ["messagequeues"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["messagequeue.sealos.io"]
    resources: ["messagequeues/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["messagequeue.sealos.io"]
    resources: ["messagequeues/finalizers"]
    verbs: ["update"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkanodepools", "kafkausers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "messagequeue.fullname" . }}-controller
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "messagequeue.fullname" . }}-controller
subjects:
  - kind: ServiceAccount
    name: {{ include "messagequeue.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "messagequeue.fullname" . }}-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "messagequeue.fullname" . }}-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "messagequeue.fullname" . }}-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "messagequeue.controllerServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "messagequeue.fullname" . }}-backend
  namespace: {{ required "backend.workspaceNamespace is required" .Values.backend.workspaceNamespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
rules:
  - apiGroups: ["messagequeue.sealos.io"]
    resources: ["messagequeues"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["messagequeue.sealos.io"]
    resources: ["messagequeues/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkas", "kafkanodepools", "kafkausers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "messagequeue.fullname" . }}-backend
  namespace: {{ required "backend.workspaceNamespace is required" .Values.backend.workspaceNamespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "messagequeue.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "messagequeue.backendServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
