{{- if .Values.serviceAccount.controller.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "messagequeue.controllerServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
---
{{- if .Values.serviceAccount.backend.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "messagequeue.backendServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
---
{{- if .Values.serviceAccount.frontend.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "messagequeue.frontendServiceAccount" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "messagequeue.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
