apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep this version in lockstep with the Kafka API fields emitted by the
# MessageQueue controller. The URL is intentionally not `latest`.
namespace: messagequeue-system
resources:
  - https://github.com/strimzi/strimzi-kafka-operator/releases/download/0.46.0/strimzi-cluster-operator-0.46.0.yaml
  - cluster-wide-rbac.yaml

# The upstream example is scoped to its example namespace and uses a
# fieldRef-derived STRIMZI_NAMESPACE. MessageQueue is multi-tenant, so the
# operator must watch every workspace namespace while running from the system
# namespace. The additional ClusterRoleBindings below provide the corresponding
# namespaced and watched permissions cluster-wide, including permission to
# delegate KafkaTopic/KafkaUser access to each workspace entity operator.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: strimzi-cluster-operator
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env/0/valueFrom
      - op: add
        path: /spec/template/spec/containers/0/env/0/value
        value: ""
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: strimzi-cluster-operator
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: strimzi-cluster-operator-entity-operator-delegation
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: strimzi-cluster-operator-leader-election
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: strimzi-cluster-operator-watched
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: strimzi-cluster-operator
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: strimzi-cluster-operator-kafka-broker-delegation
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: strimzi-cluster-operator-kafka-client-delegation
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: messagequeue-system
