<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f4f5" />
    <meta name="description" content="MessageQueue Kafka 管理控制台" />
    <title>MessageQueue | 消息队列</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app" class="app-shell">
      <header class="app-header" aria-label="MessageQueue 顶栏">
        <button
          class="button button-secondary header-back-button is-hidden"
          type="button"
          id="back-button"
          title="集群列表"
          aria-label="集群列表"
          aria-hidden="true"
        >
          集群列表
        </button>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">MQ</span>
          <span class="brand-copy">
            <strong>MessageQueue</strong>
            <small id="brand-subtitle">工作空间控制平面</small>
          </span>
        </div>

        <div class="header-actions">
          <span class="api-indicator" id="api-indicator" data-state="loading">
            <span class="indicator-dot" aria-hidden="true"></span>
            <span id="api-indicator-label">连接中</span>
          </span>
          <label class="search-field">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="search-input" type="search" placeholder="搜索集群" autocomplete="off" />
          </label>
          <button class="icon-button" type="button" title="刷新数据" aria-label="刷新数据" id="refresh-button">
            ↻
          </button>
          <button class="lang-button" type="button" id="language-button" title="切换语言" aria-label="切换语言">
            EN
          </button>
          <button class="button button-primary" type="button" id="create-button">新建</button>
        </div>
      </header>

      <main class="main-content" id="main-content" tabindex="-1">
        <h1 id="page-title" class="sr-only">MessageQueue | 消息队列</h1>
        <p id="page-description" class="sr-only">MessageQueue Kafka 管理控制台</p>

        <section class="route-panel list-panel" id="list-panel" aria-labelledby="cluster-list-title">
          <h2 id="cluster-list-title" class="sr-only">你的集群</h2>
          <div id="cluster-list" class="cluster-list" aria-live="polite" aria-busy="true"></div>
        </section>

        <section class="route-panel detail-panel is-hidden" id="detail-panel" aria-labelledby="detail-title">
          <div id="detail-content"></div>
        </section>

        <div id="notice-region" aria-live="polite"></div>
        <p id="operations-hint" class="operations-hint sr-only">运维功能正在完善中</p>
      </main>
    </div>

    <dialog class="modal" id="create-modal" aria-labelledby="create-title">
      <form method="dialog" id="create-form" novalidate>
        <div class="modal-header">
          <div>
            <p class="eyebrow" id="create-eyebrow">新资源</p>
            <h2 id="create-title">创建 Kafka 集群</h2>
            <p class="modal-description" id="create-description">
              控制器会在你的工作空间命名空间里创建 Strimzi 资源。
            </p>
          </div>
          <button class="icon-button" value="cancel" type="submit" title="关闭" aria-label="关闭" id="modal-close">×</button>
        </div>
        <div class="form-body">
          <div id="form-error" class="form-error" role="alert" hidden>请输入合法的集群名称，并检查各项配置。</div>
          <div class="field-grid">
            <label class="field field-wide">
              <span id="field-name-label">集群名称 <em id="field-name-required">必填</em></span>
              <input
                required
                pattern="[a-z0-9]([-a-z0-9]*[a-z0-9])?"
                maxlength="40"
                id="cluster-name"
                name="name"
                placeholder="orders-dev"
              />
              <small id="field-name-help">仅支持小写字母、数字和连字符。</small>
            </label>
            <label class="field">
              <span id="field-version-label">Kafka 版本 <em id="field-version-recommended">推荐</em></span>
              <select id="kafka-version" name="version">
                <option value="3.9.0">3.9.0</option>
                <option value="4.0.0">4.0.0</option>
              </select>
            </label>
            <label class="field">
              <span id="field-brokers-label">Broker 数量</span>
              <input id="broker-count" name="brokers" type="number" value="1" min="1" max="9" step="1" />
              <small id="field-brokers-help">生产环境建议至少 3 个 broker。</small>
            </label>
            <label class="field">
              <span id="field-storage-label">每个 Broker 的存储</span>
              <div class="input-suffix">
                <input id="storage-size" name="storageGi" type="number" value="20" min="1" step="1" />
                <span>Gi</span>
              </div>
            </label>
            <label class="field">
              <span id="field-class-label">存储类</span>
              <input id="storage-class" name="storageClass" value="" placeholder="默认集群存储" />
            </label>
            <label class="field">
              <span id="field-policy-label">删除策略</span>
              <select id="deletion-policy" name="deletionPolicy">
                <option value="Retain">保留数据</option>
                <option value="Delete">随集群删除</option>
              </select>
            </label>
          </div>
          <div class="impact-box">
            <div class="impact-heading">
              <span aria-hidden="true">i</span>
              <strong id="impact-heading">资源占用</strong>
            </div>
            <p id="impact-copy">1 个 broker · 20 Gi 存储 · TLS + SCRAM 认证 · 保留数据</p>
            <small id="impact-note">创建是异步的。你可以在集群详情里跟踪观测状态。</small>
          </div>
        </div>
        <div class="modal-footer">
          <button class="button button-secondary" value="cancel" type="submit" id="cancel-button">取消</button>
          <button class="button button-primary" id="submit-create" value="default" type="submit">创建</button>
        </div>
      </form>
    </dialog>
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
